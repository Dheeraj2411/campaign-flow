services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: campaignflow-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME="${APP_NAME:-CampaignFlow}"
      - APP_ENV="${APP_ENV:-production}"
      - APP_KEY="${APP_KEY}"
      - APP_DEBUG="${APP_DEBUG:-false}"
      - APP_URL="${APP_URL:-http://localhost:8000}"
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE="${DB_DATABASE:-campaignflow}"
      - DB_USERNAME="${DB_USERNAME:-campaignflow}"
      - DB_PASSWORD="${DB_PASSWORD:-secret}"
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD="${REDIS_PASSWORD:-null}"
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://meilisearch:7700
      - REVERB_APP_ID=123456
      - REVERB_APP_KEY=campaignflow_key
      - REVERB_APP_SECRET=campaignflow_secret
      - REVERB_HOST="${APP_DOMAIN:-localhost}"
      - REVERB_PORT=8080
      - REVERB_SCHEME="${REVERB_SCHEME:-http}"
    depends_on:
      - postgres
      - redis
    networks:
      - campaignflow-net

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - campaignflow-net

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-campaignflow}"
      POSTGRES_USER: "${DB_USERNAME:-campaignflow}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - campaignflow-postgres-data:/var/lib/postgresql/data
    networks:
      - campaignflow-net

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - campaignflow-redis-data:/data
    networks:
      - campaignflow-net

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
      - MEILI_MASTER_KEY="${MEILI_MASTER_KEY:-masterKey}"
    volumes:
      - campaignflow-meilisearch-data:/meili_data
    networks:
      - campaignflow-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
    restart: unless-stopped
    depends_on:
      - app
      - redis
      - postgres
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE="${DB_DATABASE:-campaignflow}"
      - DB_USERNAME="${DB_USERNAME:-campaignflow}"
      - DB_PASSWORD="${DB_PASSWORD:-secret}"
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    networks:
      - campaignflow-net

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - APP_KEY="${APP_KEY}"
      - REDIS_HOST=redis
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REVERB_APP_ID=123456
      - REVERB_APP_KEY=campaignflow_key
      - REVERB_APP_SECRET=campaignflow_secret
    networks:
      - campaignflow-net

volumes:
  campaignflow-postgres-data:
  campaignflow-redis-data:
  campaignflow-meilisearch-data:

networks:
  campaignflow-net:
    driver: bridge
