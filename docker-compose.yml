services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pingos-app
    restart: unless-stopped
    expose:
      - "9000"
    entrypoint: ["/var/www/html/docker/entrypoint.sh"]
    command: ["php-fpm"]
    environment:
      - APP_NAME=${APP_NAME:-PingOS}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-pingos}
      - DB_USERNAME=${DB_USERNAME:-pingos}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-change_me_redis_password}
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-790184}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-kgmzt0ly69fudqj8d1to}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-2n1k9nj0s62x9oimkwh3}
      - REVERB_HOST=reverb
      - REVERB_PORT=8081
      - REVERB_SCHEME=http
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-pingos_master_key_secure_32_chars_min}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - STRIPE_KEY=${STRIPE_KEY}
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp.mailtrap.io}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-hello@pingos.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-PingOS}
      - HORIZON_ALERT_EMAIL=${HORIZON_ALERT_EMAIL:-admin@pingos.com}
      - HORIZON_SLACK_WEBHOOK=${HORIZON_SLACK_WEBHOOK}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - .:/var/www/html:cached
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    networks:
      - pingos-net
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    networks:
      - pingos-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pingos}
      POSTGRES_USER: ${DB_USERNAME:-pingos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pingos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pingos} -d ${DB_DATABASE:-pingos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pingos-net

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change_me_redis_password}
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - pingos-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pingos-net

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-pingos_master_key_secure_32_chars_min}
    volumes:
      - pingos-meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pingos-net

  adminer:
    image: adminer
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      - postgres
    networks:
      - pingos-net

  worker:
    image: pingos-app
    command: /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - APP_NAME=${APP_NAME:-PingOS}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-pingos}
      - DB_USERNAME=${DB_USERNAME:-pingos}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-change_me_redis_password}
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-790184}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-kgmzt0ly69fudqj8d1to}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-2n1k9nj0s62x9oimkwh3}
      - REVERB_HOST=reverb
      - REVERB_PORT=8081
      - REVERB_SCHEME=http
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp.mailtrap.io}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-hello@pingos.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-PingOS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - STRIPE_KEY=${STRIPE_KEY}
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - HORIZON_ALERT_EMAIL=${HORIZON_ALERT_EMAIL:-admin@pingos.com}
      - HORIZON_SLACK_WEBHOOK=${HORIZON_SLACK_WEBHOOK}
    volumes:
      - .:/var/www/html:cached
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    networks:
      - pingos-net
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  reverb:
    image: pingos-app
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - APP_NAME=${APP_NAME:-PingOS}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-pingos}
      - DB_USERNAME=${DB_USERNAME:-pingos}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_STORE=redis
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-change_me_redis_password}
      - BROADCAST_CONNECTION=reverb
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8081
      - REVERB_APP_ID=${REVERB_APP_ID:-790184}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-kgmzt0ly69fudqj8d1to}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-2n1k9nj0s62x9oimkwh3}
      - REVERB_HOST=reverb
      - REVERB_PORT=8081
      - REVERB_SCHEME=http
    volumes:
      - .:/var/www/html:cached
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    networks:
      - pingos-net
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  vite:
    profiles: ["dev"]
    image: pingos-app
    command: npm run dev -- --host
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_APP_NAME=PingOS
      - VITE_APP_URL=https://madalyn-geitonogamous-blinkingly.ngrok-free.dev
      - VITE_REVERB_APP_KEY=${REVERB_APP_KEY:-kgmzt0ly69fudqj8d1to}
      - VITE_REVERB_HOST=madalyn-geitonogamous-blinkingly.ngrok-free.dev
      - VITE_REVERB_PORT=443
      - VITE_REVERB_SCHEME=https
    volumes:
      - .:/var/www/html:cached
      - node_modules_data:/var/www/html/node_modules
    networks:
      - pingos-net

volumes:
  pingos-postgres-data:
  pingos-redis-data:
  pingos-meilisearch-data:
  vendor_data:
  node_modules_data:

networks:
  pingos-net:
    driver: bridge