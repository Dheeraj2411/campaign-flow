services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: campaignflow-app
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - APP_NAME="${APP_NAME:-CampaignFlow}"
      - APP_ENV="${APP_ENV:-production}"
      - APP_KEY="${APP_KEY}"
      - APP_DEBUG="${APP_DEBUG:-false}"
      - APP_URL="${APP_URL:-http://localhost:8000}"
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE="${DB_DATABASE:-campaignflow}"
      - DB_USERNAME="${DB_USERNAME:-campaignflow}"
      - DB_PASSWORD="${DB_PASSWORD:-secret}"
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD="${REDIS_PASSWORD:-null}"
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://meilisearch:7700
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=reverb
      - REVERB_PORT=8081
      - REVERB_SCHEME=http
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/var/www/html
    networks:
      - campaignflow-net

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - campaignflow-net

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-campaignflow}"
      POSTGRES_USER: "${DB_USERNAME:-campaignflow}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - campaignflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-campaignflow} -d ${DB_DATABASE:-campaignflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campaignflow-net

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - campaignflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campaignflow-net

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
      - MEILI_MASTER_KEY="${MEILI_MASTER_KEY:-campaignflow_master_key_secure_32}"
    volumes:
      - campaignflow-meilisearch-data:/meili_data
    networks:
      - campaignflow-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
    restart: unless-stopped
    depends_on:
      - app
      - redis
      - postgres
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE="${DB_DATABASE:-campaignflow}"
      - DB_USERNAME="${DB_USERNAME:-campaignflow}"
      - DB_PASSWORD="${DB_PASSWORD:-secret}"
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - .:/var/www/html
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    networks:
      - campaignflow-net

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8081 --debug
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      - redis
    environment:
      - APP_NAME="${APP_NAME:-CampaignFlow}"
      - APP_ENV="${APP_ENV:-production}"
      - APP_KEY="${APP_KEY}"
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE="${DB_DATABASE:-campaignflow}"
      - DB_USERNAME="${DB_USERNAME:-campaignflow}"
      - DB_PASSWORD="${DB_PASSWORD:-secret}"
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD="${REDIS_PASSWORD:-null}"
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8081
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=reverb
      - REVERB_SCHEME=http
    volumes:
      - .:/var/www/html
    networks:
      - campaignflow-net

  vite:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev -- --host
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    networks:
      - campaignflow-net

volumes:
  campaignflow-postgres-data:
  campaignflow-redis-data:
  campaignflow-meilisearch-data:

networks:
  campaignflow-net:
    driver: bridge
